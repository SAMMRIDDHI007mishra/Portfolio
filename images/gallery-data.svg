<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <rect width="300" height="240" fill="#FFF5EB" rx="12" />

  <!-- Pandas Dataframe & Chart visual -->
  <g transform="translate(30, 30)">
    <!-- Dataframe table card -->
    <rect x="0" y="0" width="240" height="135" rx="8" fill="#FFFFFF" stroke="#4A2E4B" stroke-width="2.5" />
    
    <!-- Table Header -->
    <rect x="0" y="0" width="240" height="28" rx="8" fill="#FFCAD4" />
    <rect x="0" y="18" width="240" height="10" fill="#FFCAD4" />
    <text x="15" y="18" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#3C2A3E">pd.DataFrame.head()</text>

    <!-- Cute Panda Face Icon -->
    <circle cx="215" cy="14" r="9" fill="#FFFFFF" stroke="#4A2E4B" stroke-width="1.5" />
    <circle cx="209" cy="8" r="3" fill="#3C2A3E" />
    <circle cx="221" cy="8" r="3" fill="#3C2A3E" />
    <circle cx="212" cy="14" r="1.5" fill="#3C2A3E" />
    <circle cx="218" cy="14" r="1.5" fill="#3C2A3E" />

    <!-- Table Rows -->
    <g font-family="'Courier New', monospace" font-size="8" fill="#3C2A3E">
      <line x1="0" y1="52" x2="240" y2="52" stroke="#FFCAD4" stroke-width="1" />
      <line x1="0" y1="78" x2="240" y2="78" stroke="#FFCAD4" stroke-width="1" />
      <line x1="0" y1="104" x2="240" y2="104" stroke="#FFCAD4" stroke-width="1" />
      
      <text x="15" y="44" font-weight="bold" fill="#735D78">id</text>
      <text x="60" y="44" font-weight="bold" fill="#735D78">feature_a</text>
      <text x="135" y="44" font-weight="bold" fill="#735D78">variance</text>
      <text x="195" y="44" font-weight="bold" fill="#735D78">label</text>

      <text x="15" y="68">01</text>
      <text x="60" y="68">0.8421</text>
      <text x="135" y="68">0.034</text>
      <text x="195" y="68" fill="#FB6F92">1</text>

      <text x="15" y="94">02</text>
      <text x="60" y="94">0.3129</text>
      <text x="135" y="94">0.012</text>
      <text x="195" y="94" fill="#2EC4B6">0</text>

      <text x="15" y="120">03</text>
      <text x="60" y="120">0.9510</text>
      <text x="135" y="120">0.058</text>
      <text x="195" y="120" fill="#FB6F92">1</text>
    </g>
  </g>

  <!-- Bar Chart Stickers below -->
  <g transform="translate(60, 180)">
    <rect x="0" y="15" width="22" height="25" rx="3" fill="#FF8FAB" stroke="#4A2E4B" stroke-width="1.5" />
    <rect x="35" y="5" width="22" height="35" rx="3" fill="#FFE599" stroke="#4A2E4B" stroke-width="1.5" />
    <rect x="70" y="-10" width="22" height="50" rx="3" fill="#95D5B2" stroke="#4A2E4B" stroke-width="1.5" />
    <rect x="105" y="8" width="22" height="32" rx="3" fill="#E0AAFF" stroke="#4A2E4B" stroke-width="1.5" />
    <rect x="140" y="-15" width="22" height="55" rx="3" fill="#FB6F92" stroke="#4A2E4B" stroke-width="1.5" />
  </g>
</svg>
