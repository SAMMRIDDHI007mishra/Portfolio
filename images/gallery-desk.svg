<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <linearGradient id="roomGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="100%" stop-color="#FFE3EC" />
    </linearGradient>
  </defs>
  <rect width="300" height="240" fill="url(#roomGrad)" rx="12" />

  <!-- Pegboard Wall details -->
  <g fill="#FB6F92" opacity="0.3">
    <circle cx="30" cy="30" r="2" /><circle cx="60" cy="30" r="2" /><circle cx="90" cy="30" r="2" /><circle cx="120" cy="30" r="2" />
    <circle cx="180" cy="30" r="2" /><circle cx="210" cy="30" r="2" /><circle cx="240" cy="30" r="2" /><circle cx="270" cy="30" r="2" />
    <circle cx="30" cy="60" r="2" /><circle cx="60" cy="60" r="2" /><circle cx="90" cy="60" r="2" /><circle cx="120" cy="60" r="2" />
    <circle cx="180" cy="60" r="2" /><circle cx="210" cy="60" r="2" /><circle cx="240" cy="60" r="2" /><circle cx="270" cy="60" r="2" />
  </g>

  <!-- Pinned Photo / Postcards on Pegboard -->
  <g transform="translate(40, 25) rotate(-6)">
    <rect x="0" y="0" width="50" height="55" rx="3" fill="#FFFFFF" stroke="#4A2E4B" stroke-width="1.5" />
    <rect x="5" y="5" width="40" height="35" rx="2" fill="#FFE5EC" />
    <text x="25" y="26" font-family="'Segoe UI', sans-serif" font-size="14" text-anchor="middle">💻</text>
    <circle cx="25" cy="-2" r="3" fill="#FB6F92" />
  </g>
  <g transform="translate(210, 20) rotate(5)">
    <rect x="0" y="0" width="55" height="45" rx="3" fill="#FFFFFF" stroke="#4A2E4B" stroke-width="1.5" />
    <rect x="5" y="5" width="45" height="25" rx="2" fill="#D8F3DC" />
    <text x="27" y="21" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">🌸 SIT</text>
    <circle cx="27" cy="-2" r="3" fill="#FFE599" stroke="#4A2E4B" stroke-width="1" />
  </g>

  <!-- Desk Surface -->
  <rect x="15" y="150" width="270" height="18" rx="6" fill="#FFE0E9" stroke="#4A2E4B" stroke-width="2.5" />
  <rect x="25" y="168" width="250" height="55" fill="#FFCAD4" stroke="#4A2E4B" stroke-width="2" />

  <!-- Dual Monitor / Laptop setup on desk -->
  <!-- Monitor -->
  <g transform="translate(100, 85)">
    <rect x="0" y="0" width="100" height="60" rx="6" fill="#3C2A3E" stroke="#4A2E4B" stroke-width="2" />
    <rect x="5" y="5" width="90" height="50" rx="3" fill="#201124" />
    <!-- Graph on monitor -->
    <polyline points="10,40 30,25 50,32 75,15" fill="none" stroke="#FF8FAB" stroke-width="1.5" />
    <rect x="44" y="60" width="12" height="12" fill="#4A2E4B" />
    <rect x="35" y="70" width="30" height="4" rx="2" fill="#4A2E4B" />
  </g>

  <!-- Laptop to side -->
  <g transform="translate(40, 115)">
    <rect x="0" y="0" width="50" height="35" rx="4" fill="#FF8FAB" stroke="#4A2E4B" stroke-width="1.5" />
    <rect x="4" y="4" width="42" height="27" rx="2" fill="#3C2A3E" />
    <path d="M -5 35 L 55 35 L 58 40 L -8 40 Z" fill="#FFE5EC" stroke="#4A2E4B" stroke-width="1.5" />
  </g>

  <!-- Cute plant & tea -->
  <g transform="translate(225, 115)">
    <!-- Plant -->
    <rect x="10" y="20" width="20" height="18" rx="3" fill="#FFE5D9" stroke="#4A2E4B" stroke-width="1.5" />
    <circle cx="20" cy="15" r="8" fill="#74C69D" stroke="#4A2E4B" stroke-width="1.5" />
  </g>

  <!-- Mechanical Keyboard -->
  <rect x="110" y="145" width="75" height="10" rx="3" fill="#FFFFFF" stroke="#4A2E4B" stroke-width="1.5" />
</svg>
