<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <rect width="300" height="240" fill="#F0FBFB" rx="12" />

  <!-- Breadboard & Wire Sketches -->
  <g transform="translate(45, 30)">
    <!-- Circuit board -->
    <rect x="0" y="0" width="210" height="130" rx="8" fill="#FFFFFF" stroke="#4A2E4B" stroke-width="2.5" />
    
    <!-- Microcontroller -->
    <rect x="65" y="35" width="80" height="60" rx="6" fill="#3C2A3E" stroke="#4A2E4B" stroke-width="2" />
    <text x="105" y="68" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#FFE599" text-anchor="middle">SENSORS</text>
    <text x="105" y="80" font-family="'Courier New', monospace" font-size="7" fill="#FF8FAB" text-anchor="middle">GPIO · I2C</text>

    <!-- Looping colorful wires -->
    <path d="M 65 45 C 30 20 20 70 20 100" fill="none" stroke="#FB6F92" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 145 45 C 180 20 190 70 190 100" fill="none" stroke="#2EC4B6" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 105 35 C 105 10 130 10 150 20" fill="none" stroke="#FFE599" stroke-width="2.5" stroke-linecap="round" />

    <!-- Cute mini LED blinking -->
    <circle cx="20" cy="100" r="5" fill="#FB6F92" stroke="#4A2E4B" stroke-width="1.5" />
    <circle cx="190" cy="100" r="5" fill="#95D5B2" stroke="#4A2E4B" stroke-width="1.5" />
  </g>

  <!-- Washi Tape & Sticker -->
  <g transform="translate(60, 185) rotate(-3)">
    <rect x="0" y="0" width="180" height="26" rx="4" fill="#FFE599" stroke="#4A2E4B" stroke-width="2" />
    <text x="90" y="17" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#3C2A3E" text-anchor="middle">⚡ HARDWARE EXPERIMENT ♡</text>
  </g>
</svg>
