<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <rect width="300" height="240" fill="#F8F3FF" rx="12" />

  <!-- Science Flask with binary code bubbles -->
  <g transform="translate(100, 35)">
    <!-- Flask Neck & Body -->
    <path d="M 40 10 L 60 10 L 60 45 L 95 125 A 15 15 0 0 1 82 145 L 18 145 A 15 15 0 0 1 5 125 L 40 45 Z" fill="#FFFFFF" stroke="#4A2E4B" stroke-width="3" stroke-linejoin="round" />
    <rect x="35" y="6" width="30" height="7" rx="3" fill="#E0AAFF" stroke="#4A2E4B" stroke-width="2" />

    <!-- Pink liquid inside -->
    <path d="M 12 125 L 88 125 A 15 15 0 0 1 82 143 L 18 143 A 15 15 0 0 1 12 125 Z" fill="#FB6F92" />
    <path d="M 22 105 Q 50 95 78 105 L 88 125 L 12 125 Z" fill="#FF8FAB" />

    <!-- Cute Face on Flask -->
    <circle cx="42" cy="118" r="2.5" fill="#FFFFFF" />
    <circle cx="58" cy="118" r="2.5" fill="#FFFFFF" />
    <path d="M 48 123 Q 50 126 52 123" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />

    <!-- Bubbles rising out -->
    <circle cx="50" cy="30" r="4" fill="#FFE599" stroke="#4A2E4B" stroke-width="1.5" />
    <circle cx="45" cy="0" r="6" fill="#D8F3DC" stroke="#4A2E4B" stroke-width="1.5" />
    <circle cx="65" cy="-15" r="7" fill="#FF8FAB" stroke="#4A2E4B" stroke-width="1.5" />

    <!-- Floating 0s and 1s and hearts -->
    <text x="35" y="-12" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#735D78">1</text>
    <text x="80" y="5" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#735D78">0</text>
    <path d="M 20 -20 C 20 -20 15 -25 12 -25 C 9 -25 7 -22 7 -19 C 7 -15 20 -8 20 -8 C 20 -8 33 -15 33 -19 C 33 -22 31 -25 28 -25 C 25 -25 20 -20 20 -20 Z" fill="#FB6F92" />
  </g>

  <!-- Cute Sticker label -->
  <g transform="translate(70, 195) rotate(-2)">
    <rect x="0" y="0" width="160" height="26" rx="13" fill="#D8F3DC" stroke="#4A2E4B" stroke-width="2" />
    <text x="80" y="17" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#2D6A4F" text-anchor="middle">★ EXPERIMENT #042 ♡</text>
  </g>
</svg>
