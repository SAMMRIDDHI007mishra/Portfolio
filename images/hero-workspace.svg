<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="100%" stop-color="#FFE3EC" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3C2A3E" />
      <stop offset="100%" stop-color="#251828" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE0E9" />
      <stop offset="100%" stop-color="#FCD5E2" />
    </linearGradient>
    <!-- Soft Cartoon Shadow -->
    <filter id="stickerShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#4A2E4B" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    .star-twinkle { animation: floatSlow 3.2s ease-in-out infinite alternate; }
    .heart-float { animation: floatHeart 2.8s ease-in-out infinite alternate; }
    .cloud-drift { animation: driftCloud 4.5s ease-in-out infinite alternate; }
    .bot-nod { animation: nodBot 3s ease-in-out infinite; }
    .sparkle-pulse { animation: pulseSparkle 2s ease-in-out infinite alternate; }
    @keyframes floatSlow { 0% { transform: translateY(0px) rotate(0deg); } 100% { transform: translateY(-7px) rotate(4deg); } }
    @keyframes floatHeart { 0% { transform: translateY(0px) scale(1); } 100% { transform: translateY(-9px) scale(1.08); } }
    @keyframes driftCloud { 0% { transform: translateX(0px); } 100% { transform: translateX(8px); } }
    @keyframes nodBot { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
    @keyframes pulseSparkle { 0% { transform: scale(0.9); opacity: 0.8; } 100% { transform: scale(1.15); opacity: 1; } }
  </style>

  <!-- BACKGROUND ARCH / DIGITAL ROOM WALL -->
  <path d="M 70 470 L 70 140 A 230 230 0 0 1 530 140 L 530 470 Z" fill="url(#bgGrad)" stroke="#4A2E4B" stroke-width="4" stroke-linejoin="round" />
  
  <!-- CUTE WALLPAPER PATTERN (Tiny Dots & Hearts) -->
  <g opacity="0.25" fill="#FB6F92">
    <circle cx="120" cy="180" r="3" />
    <circle cx="160" cy="140" r="2.5" />
    <circle cx="200" cy="180" r="3" />
    <circle cx="400" cy="180" r="3" />
    <circle cx="440" cy="140" r="2.5" />
    <circle cx="480" cy="180" r="3" />
    <circle cx="140" cy="230" r="2.5" />
    <circle cx="180" cy="270" r="3" />
    <circle cx="420" cy="230" r="2.5" />
    <circle cx="460" cy="270" r="3" />
  </g>

  <!-- CUTE ARCH WINDOW TO SKY -->
  <g transform="translate(110, 80)">
    <rect x="0" y="0" width="100" height="130" rx="50" fill="#E8F4F8" stroke="#4A2E4B" stroke-width="3" />
    <!-- Window Panes -->
    <line x1="50" y1="0" x2="50" y2="130" stroke="#4A2E4B" stroke-width="2.5" />
    <line x1="0" y1="70" x2="100" y2="70" stroke="#4A2E4B" stroke-width="2.5" />
    <!-- Crescent Moon inside window -->
    <path d="M 65 30 A 15 15 0 0 0 82 45 A 18 18 0 1 1 65 30 Z" fill="#FFE599" stroke="#4A2E4B" stroke-width="1.5" />
    <!-- Sky stars -->
    <circle cx="30" cy="40" r="2" fill="#FFE599" />
    <circle cx="75" cy="95" r="1.5" fill="#FFE599" />
    <!-- Soft little cloud on window sill -->
    <path d="M 15 125 A 10 10 0 0 1 35 125 A 8 8 0 0 1 50 125 L 15 125 Z" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- FLOATING DECORATIONS (Top & Sides) -->
  <!-- Cloud Top Right -->
  <g class="cloud-drift" transform="translate(420, 70)">
    <path d="M 20 40 A 18 18 0 0 1 56 30 A 24 24 0 0 1 96 35 A 18 18 0 0 1 115 52 L 15 52 A 15 15 0 0 1 20 40 Z" fill="#FFFFFF" stroke="#4A2E4B" stroke-width="3" filter="url(#stickerShadow)" />
    <!-- Face on cloud -->
    <circle cx="58" cy="42" r="2" fill="#4A2E4B" />
    <circle cx="74" cy="42" r="2" fill="#4A2E4B" />
    <path d="M 63 46 Q 66 49 69 46" fill="none" stroke="#4A2E4B" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="52" cy="45" r="2.5" fill="#FF8FAB" opacity="0.6" />
    <circle cx="80" cy="45" r="2.5" fill="#FF8FAB" opacity="0.6" />
  </g>

  <!-- Sparkling Stars -->
  <g class="star-twinkle" transform="translate(85, 230)">
    <path d="M 15 0 L 19 11 L 30 15 L 19 19 L 15 30 L 11 19 L 0 15 L 11 11 Z" fill="#FFE599" stroke="#4A2E4B" stroke-width="2.5" stroke-linejoin="round" />
  </g>
  <g class="sparkle-pulse" transform="translate(490, 160)">
    <path d="M 12 0 L 15 9 L 24 12 L 15 15 L 12 24 L 9 15 L 0 12 L 9 9 Z" fill="#FF8FAB" stroke="#4A2E4B" stroke-width="2" stroke-linejoin="round" />
  </g>
  <g class="star-twinkle" transform="translate(515, 240)">
    <circle cx="10" cy="10" r="5" fill="#E0AAFF" stroke="#4A2E4B" stroke-width="2" />
  </g>

  <!-- Cute Floating Heart with wings -->
  <g class="heart-float" transform="translate(380, 140)">
    <!-- Little left wing -->
    <path d="M 10 16 C 0 8 2 0 14 6 C 10 12 12 16 10 16 Z" fill="#FFFFFF" stroke="#4A2E4B" stroke-width="2" />
    <!-- Little right wing -->
    <path d="M 40 16 C 50 8 48 0 36 6 C 40 12 38 16 40 16 Z" fill="#FFFFFF" stroke="#4A2E4B" stroke-width="2" />
    <!-- Heart Body -->
    <path d="M25 32 C25 32 10 21 10 12 C10 6 15 2 20 2 C23 2 25 5 25 7 C25 5 27 2 30 2 C35 2 40 6 40 12 C40 21 25 32 25 32 Z" fill="#FB6F92" stroke="#4A2E4B" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="17" cy="8" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- FLOATING TECHNICAL STICKERS & ICONS -->
  <!-- Sticker 1: Binary / Python pill -->
  <g transform="translate(330, 95) rotate(-6)">
    <rect x="0" y="0" width="75" height="26" rx="13" fill="#D8F3DC" stroke="#4A2E4B" stroke-width="2.5" />
    <text x="37" y="17" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#3C2A3E" text-anchor="middle">&lt;AI /&gt; ♡</text>
  </g>
  <!-- Sticker 2: Brain icon chip -->
  <g transform="translate(230, 75) rotate(5)">
    <rect x="0" y="0" width="55" height="24" rx="6" fill="#E0AAFF" stroke="#4A2E4B" stroke-width="2.5" />
    <text x="27" y="16" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#3C2A3E" text-anchor="middle">🧠 ML</text>
  </g>

  <!-- POST-IT NOTES ON WALL -->
  <!-- Note 1: Yellow sticky note -->
  <g transform="translate(150, 240) rotate(-7)">
    <rect x="0" y="0" width="60" height="60" fill="#FFF275" stroke="#4A2E4B" stroke-width="2.5" filter="url(#stickerShadow)" />
    <!-- Pin / Tape -->
    <rect x="18" y="-5" width="24" height="10" fill="#FF8FAB" opacity="0.8" />
    <text x="30" y="24" font-family="'Comic Sans MS', cursive, sans-serif" font-size="9" font-weight="bold" fill="#3C2A3E" text-anchor="middle">fix bug</text>
    <text x="30" y="38" font-family="'Comic Sans MS', cursive, sans-serif" font-size="9" font-weight="bold" fill="#3C2A3E" text-anchor="middle">train model</text>
    <text x="30" y="50" font-family="'Segoe UI', sans-serif" font-size="10" fill="#FB6F92" text-anchor="middle">♡ ♡ ♡</text>
  </g>

  <!-- Note 2: Pink sticky note -->
  <g transform="translate(425, 235) rotate(6)">
    <rect x="0" y="0" width="55" height="55" fill="#FFCAD4" stroke="#4A2E4B" stroke-width="2.5" filter="url(#stickerShadow)" />
    <!-- Washi Tape -->
    <rect x="16" y="-6" width="22" height="11" fill="#C77DFF" opacity="0.8" />
    <text x="27" y="22" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#3C2A3E" text-anchor="middle">FRIDAY</text>
    <text x="27" y="36" font-family="'Segoe UI', sans-serif" font-size="8" fill="#3C2A3E" text-anchor="middle">intent test</text>
    <circle cx="27" cy="46" r="3" fill="#FB6F92" />
  </g>

  <!-- WOODEN/PASTEL DESK SURFACE -->
  <rect x="40" y="385" width="520" height="28" rx="8" fill="url(#deskGrad)" stroke="#4A2E4B" stroke-width="4" filter="url(#stickerShadow)" />
  <rect x="55" y="413" width="490" height="50" fill="#FFD0DD" stroke="#4A2E4B" stroke-width="3" />
  <!-- Cute Desk Drawer Handle -->
  <rect x="275" y="428" width="50" height="14" rx="7" fill="#FB6F92" stroke="#4A2E4B" stroke-width="2.5" />
  <circle cx="290" cy="435" r="2" fill="#FFFFFF" />
  <circle cx="310" cy="435" r="2" fill="#FFFFFF" />

  <!-- DESK MAT (Soft Lavender) -->
  <rect x="100" y="375" width="400" height="14" rx="7" fill="#E0AAFF" stroke="#4A2E4B" stroke-width="2" />

  <!-- POTTED SUCCULENT PLANT (Left) -->
  <g transform="translate(85, 305)">
    <!-- Pot -->
    <path d="M 12 45 L 20 80 L 50 80 L 58 45 Z" fill="#FFE5D9" stroke="#4A2E4B" stroke-width="3" stroke-linejoin="round" />
    <rect x="9" y="40" width="52" height="9" rx="4" fill="#FFCAD4" stroke="#4A2E4B" stroke-width="2.5" />
    <!-- Pot Face -->
    <circle cx="29" cy="62" r="2" fill="#4A2E4B" />
    <circle cx="41" cy="62" r="2" fill="#4A2E4B" />
    <path d="M 32 68 Q 35 71 38 68" fill="none" stroke="#4A2E4B" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="24" cy="65" r="2" fill="#FF8FAB" />
    <circle cx="46" cy="65" r="2" fill="#FF8FAB" />
    <!-- Leaves -->
    <path d="M 35 40 C 25 25 15 28 20 40 Z" fill="#95D5B2" stroke="#4A2E4B" stroke-width="2.5" />
    <path d="M 35 40 C 45 25 55 28 50 40 Z" fill="#74C69D" stroke="#4A2E4B" stroke-width="2.5" />
    <path d="M 35 40 C 30 15 40 15 35 40 Z" fill="#52B788" stroke="#4A2E4B" stroke-width="2.5" />
    <!-- Tiny Flower on Plant -->
    <circle cx="35" cy="18" r="4" fill="#FB6F92" stroke="#4A2E4B" stroke-width="1.5" />
    <circle cx="35" cy="18" r="1.5" fill="#FFE599" />
  </g>

  <!-- MUG OF STRAWBERRY TEA/BOBA WITH HEART STEAM (Right) -->
  <g transform="translate(470, 315)">
    <!-- Steam -->
    <g class="heart-float">
      <path d="M 18 10 Q 23 2 18 -6 Q 13 -14 18 -22" fill="none" stroke="#FB6F92" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" />
      <path d="M 28 12 Q 33 4 28 -4 Q 23 -12 28 -20" fill="none" stroke="#FF8FAB" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" />
      <path d="M 23 -30 C 23 -30 18 -35 15 -35 C 12 -35 10 -32 10 -29 C 10 -25 23 -18 23 -18 C 23 -18 36 -25 36 -29 C 36 -32 34 -35 31 -35 C 28 -35 23 -30 23 -30 Z" fill="#FB6F92" />
    </g>
    <!-- Handle -->
    <path d="M 38 35 C 54 35 54 60 38 60" fill="none" stroke="#4A2E4B" stroke-width="3" stroke-linecap="round" />
    <!-- Mug Body -->
    <rect x="6" y="24" width="34" height="48" rx="7" fill="#FFFFFF" stroke="#4A2E4B" stroke-width="3" />
    <!-- Mug Heart Deco -->
    <path d="M 23 48 C 23 48 16 42 16 38 C 16 35 18 33 21 33 C 22.5 33 23 34.5 23 35 C 23 34.5 23.5 33 25 33 C 28 33 30 35 30 38 C 30 42 23 48 23 48 Z" fill="#FB6F92" />
  </g>

  <!-- CUTE LAPTOP (Center) -->
  <g transform="translate(185, 205)">
    <!-- SCREEN SHELL -->
    <rect x="0" y="0" width="230" height="155" rx="14" fill="#FF8FAB" stroke="#4A2E4B" stroke-width="3.5" filter="url(#stickerShadow)" />
    <!-- SCREEN DISPLAY -->
    <rect x="12" y="12" width="206" height="131" rx="8" fill="url(#screenGrad)" stroke="#4A2E4B" stroke-width="2" />
    
    <!-- CODE EDITOR HEADER -->
    <rect x="12" y="12" width="206" height="18" rx="8" fill="#4A2E4B" />
    <!-- 3 cute dots -->
    <circle cx="24" cy="21" r="3.5" fill="#FB6F92" />
    <circle cx="34" cy="21" r="3.5" fill="#FFE599" />
    <circle cx="44" cy="21" r="3.5" fill="#95D5B2" />
    <text x="115" y="24" font-family="'Courier New', monospace" font-size="8" fill="#FFCAD4" text-anchor="middle">friday_brain.py ♡</text>

    <!-- CODE CONTENT LINES -->
    <g font-family="'Courier New', monospace" font-size="9" font-weight="bold">
      <!-- Line 1 -->
      <text x="24" y="44" fill="#C77DFF">import</text>
      <text x="64" y="44" fill="#FFFFFF">numpy</text>
      <text x="96" y="44" fill="#C77DFF">as</text>
      <text x="112" y="44" fill="#FFE599">np</text>

      <!-- Line 2 -->
      <text x="24" y="58" fill="#C77DFF">class</text>
      <text x="58" y="58" fill="#95D5B2">FridayAI</text>
      <text x="105" y="58" fill="#FFFFFF">:</text>

      <!-- Line 3 -->
      <text x="36" y="72" fill="#FB6F92">def</text>
      <text x="60" y="72" fill="#FFE599">__init__</text>
      <text x="110" y="72" fill="#FFFFFF">(self):</text>

      <!-- Line 4 -->
      <text x="48" y="86" fill="#FFFFFF">self.intent =</text>
      <text x="126" y="86" fill="#FF8FAB">"learn"</text>

      <!-- Line 5 -->
      <text x="48" y="100" fill="#FB6F92">def</text>
      <text x="72" y="100" fill="#95D5B2">think</text>
      <text x="102" y="100" fill="#FFFFFF">(self):</text>

      <!-- Line 6 -->
      <text x="60" y="114" fill="#C77DFF">return</text>
      <text x="100" y="114" fill="#FFE599">"curious ♡"</text>

      <!-- Blinking pink cursor -->
      <rect x="170" y="105" width="6" height="11" fill="#FB6F92">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>

      <!-- Tiny chart sparkline in bottom corner of screen -->
      <path d="M 140 135 L 155 125 L 170 130 L 185 118 L 202 122" fill="none" stroke="#C77DFF" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- KEYBOARD BASE -->
    <path d="M -25 155 L 255 155 L 270 180 L -40 180 Z" fill="#FFE5EC" stroke="#4A2E4B" stroke-width="3.5" stroke-linejoin="round" />
    <!-- Trackpad -->
    <rect x="85" y="160" width="60" height="15" rx="3" fill="#FFCAD4" stroke="#4A2E4B" stroke-width="1.5" />
    <!-- Keyboard notch -->
    <path d="M 100 155 Q 115 158 130 155" fill="none" stroke="#4A2E4B" stroke-width="2" />
  </g>

  <!-- CUTE TINY AI BOT COMPANION (Next to Laptop) -->
  <g class="bot-nod" transform="translate(140, 290)">
    <!-- Shadow -->
    <ellipse cx="25" cy="85" rx="20" ry="5" fill="#4A2E4B" opacity="0.2" />
    <!-- Antenna -->
    <line x1="25" y1="20" x2="25" y2="8" stroke="#4A2E4B" stroke-width="2.5" />
    <circle cx="25" cy="6" r="4" fill="#FB6F92" stroke="#4A2E4B" stroke-width="2" />
    <!-- Bot Head/Body -->
    <rect x="5" y="20" width="40" height="38" rx="14" fill="#FFFFFF" stroke="#4A2E4B" stroke-width="3" />
    <!-- Face Screen -->
    <rect x="11" y="26" width="28" height="18" rx="6" fill="#3C2A3E" />
    <!-- Heart Eyes -->
    <path d="M 17 35 C 17 35 14 32 14 30 C 14 28 16 27 17.5 28.5 C 19 27 21 28 21 30 C 21 32 17 35 17 35 Z" fill="#FF8FAB" />
    <path d="M 31 35 C 31 35 28 32 28 30 C 28 28 30 27 31.5 28.5 C 33 27 35 28 35 30 C 35 32 31 35 31 35 Z" fill="#FF8FAB" />
    <!-- Bot Blush -->
    <circle cx="9" cy="48" r="2" fill="#FF8FAB" />
    <circle cx="41" cy="48" r="2" fill="#FF8FAB" />
    <!-- Bot Wheels/Base -->
    <rect x="10" y="58" width="30" height="14" rx="7" fill="#E0AAFF" stroke="#4A2E4B" stroke-width="2.5" />
    <!-- Waving Arm -->
    <path d="M 5 36 C -4 30 -6 18 0 14" fill="none" stroke="#4A2E4B" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="14" r="2.5" fill="#FB6F92" />
  </g>

  <!-- NOTEBOOK WITH PEN (Foreground Right) -->
  <g transform="translate(370, 350) rotate(-4)">
    <!-- Notebook body -->
    <rect x="0" y="0" width="85" height="42" rx="4" fill="#FFF8F0" stroke="#4A2E4B" stroke-width="2.5" filter="url(#stickerShadow)" />
    <!-- Wire binding -->
    <g fill="#4A2E4B">
      <circle cx="8" cy="8" r="2.5" />
      <circle cx="8" cy="18" r="2.5" />
      <circle cx="8" cy="28" r="2.5" />
      <circle cx="8" cy="36" r="2.5" />
    </g>
    <!-- Doodle lines -->
    <line x1="20" y1="12" x2="72" y2="12" stroke="#FF8FAB" stroke-width="2" stroke-linecap="round" />
    <line x1="20" y1="20" x2="65" y2="20" stroke="#735D78" stroke-width="1.5" stroke-linecap="round" />
    <line x1="20" y1="28" x2="55" y2="28" stroke="#735D78" stroke-width="1.5" stroke-linecap="round" />
    <!-- Tiny heart doodle on notebook -->
    <path d="M 68 32 C 68 32 64 28 64 26 C 64 24 66 23 67 24 C 68 23 70 24 70 26 C 70 28 68 32 68 32 Z" fill="#FB6F92" />
    <!-- Pink Stylus Pen -->
    <rect x="15" y="-6" width="55" height="5" rx="2.5" fill="#FB6F92" stroke="#4A2E4B" stroke-width="1.5" transform="rotate(8 15 -6)" />
  </g>

  <!-- SCRAPBOOK CORNER TAPES / STICKERS -->
  <!-- Bottom-left sticker: "CSE · SIT" -->
  <g transform="translate(65, 435) rotate(-3)">
    <rect x="0" y="0" width="95" height="24" rx="4" fill="#FFE599" stroke="#4A2E4B" stroke-width="2" />
    <text x="47" y="16" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#3C2A3E" text-anchor="middle">★ SIT NAGPUR ★</text>
  </g>
  <!-- Bottom-right sticker: "HELLO WORLD ♡" -->
  <g transform="translate(420, 438) rotate(2)">
    <rect x="0" y="0" width="115" height="24" rx="4" fill="#FFCAD4" stroke="#4A2E4B" stroke-width="2" />
    <text x="57" y="16" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#3C2A3E" text-anchor="middle">♡ CODE &amp; DREAMS</text>
  </g>
</svg>
