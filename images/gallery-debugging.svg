<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <linearGradient id="nightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3C2A3E" />
      <stop offset="100%" stop-color="#241426" />
    </linearGradient>
  </defs>
  <rect width="300" height="240" fill="url(#nightGrad)" rx="12" />
  <!-- Stars in the night window -->
  <circle cx="45" cy="40" r="2" fill="#FFE599" />
  <circle cx="85" cy="25" r="1.5" fill="#FFFFFF" />
  <circle cx="230" cy="35" r="2" fill="#FFE599" />
  <circle cx="265" cy="65" r="1.5" fill="#FFFFFF" />
  <!-- Crescent moon -->
  <path d="M 50 70 A 16 16 0 0 0 72 86 A 20 20 0 1 1 50 70 Z" fill="#FFE599" />

  <!-- Desk & Glowing Laptop -->
  <rect x="25" y="180" width="250" height="15" rx="5" fill="#FFEBF0" stroke="#FFCAD4" stroke-width="1.5" />
  
  <!-- Glow from laptop -->
  <polygon points="110,130 190,130 230,180 70,180" fill="#FF8FAB" opacity="0.15" />

  <!-- Laptop -->
  <g transform="translate(100, 110)">
    <rect x="0" y="0" width="100" height="65" rx="6" fill="#FF8FAB" stroke="#FFFFFF" stroke-width="2" />
    <rect x="6" y="6" width="88" height="53" rx="4" fill="#1E1220" />
    <!-- Code line glow -->
    <line x1="12" y1="18" x2="55" y2="18" stroke="#FB6F92" stroke-width="2" stroke-linecap="round" />
    <line x1="12" y1="28" x2="78" y2="28" stroke="#FFE599" stroke-width="2" stroke-linecap="round" />
    <line x1="20" y1="38" x2="65" y2="38" stroke="#95D5B2" stroke-width="2" stroke-linecap="round" />
    <line x1="12" y1="48" x2="40" y2="48" stroke="#E0AAFF" stroke-width="2" stroke-linecap="round" />
    <!-- Laptop base -->
    <path d="M -15 65 L 115 65 L 122 74 L -22 74 Z" fill="#FFE5EC" stroke="#FFFFFF" stroke-width="1.5" />
  </g>

  <!-- Tea Mug with heart steam -->
  <g transform="translate(225, 145)">
    <rect x="0" y="10" width="22" height="26" rx="4" fill="#FFFFFF" />
    <path d="M 22 16 C 30 16 30 28 22 28" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <path d="M 11 4 Q 14 0 11 -4" fill="none" stroke="#FF8FAB" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="11" cy="23" r="3" fill="#FB6F92" />
  </g>

  <!-- Washi tape at top -->
  <rect x="110" y="8" width="80" height="18" rx="2" fill="#FB6F92" opacity="0.8" />
  <text x="150" y="21" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">02:45 AM ♡</text>
</svg>
