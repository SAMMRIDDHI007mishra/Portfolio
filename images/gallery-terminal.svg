<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <rect width="300" height="240" fill="#FFEBF2" rx="12" />

  <!-- Cute Terminal Window -->
  <g transform="translate(25, 25)">
    <rect x="0" y="0" width="250" height="180" rx="10" fill="#2A1B2D" stroke="#4A2E4B" stroke-width="2.5" />
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="250" height="24" rx="10" fill="#3D2940" />
    <rect x="0" y="14" width="250" height="10" fill="#3D2940" />
    <circle cx="16" cy="12" r="3.5" fill="#FB6F92" />
    <circle cx="28" cy="12" r="3.5" fill="#FFE599" />
    <circle cx="40" cy="12" r="3.5" fill="#95D5B2" />
    <text x="125" y="15" font-family="'Courier New', monospace" font-size="8" fill="#FFCAD4" text-anchor="middle">samriddhi@sit-laptop:~ ♡</text>

    <!-- Terminal Text -->
    <g font-family="'Courier New', monospace" font-size="8.5" font-weight="bold">
      <text x="15" y="44" fill="#FB6F92">$</text>
      <text x="25" y="44" fill="#FFFFFF">git status</text>
      
      <text x="15" y="58" fill="#FFE599">On branch main</text>
      <text x="15" y="70" fill="#95D5B2">Your branch is up to date.</text>

      <text x="15" y="90" fill="#FB6F92">$</text>
      <text x="25" y="90" fill="#FFFFFF">python3 train_friday.py</text>

      <text x="15" y="106" fill="#C77DFF">[INFO]</text>
      <text x="50" y="106" fill="#FFFFFF">loading intent dataset...</text>
      <text x="15" y="120" fill="#95D5B2">[OK]</text>
      <text x="40" y="120" fill="#FFE599">model ready: curious mode on ♡</text>

      <text x="15" y="142" fill="#FB6F92">$</text>
      <rect x="25" y="133" width="7" height="11" fill="#FB6F92" />
    </g>
  </g>
</svg>
