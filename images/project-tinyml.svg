<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="iotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF7F6" />
      <stop offset="100%" stop-color="#FFEBF0" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#iotGrad)" rx="16" />

  <!-- Breadboard & Microcontroller -->
  <g transform="translate(60, 35)">
    <!-- Breadboard base -->
    <rect x="0" y="0" width="280" height="145" rx="10" fill="#FFFFFF" stroke="#4A2E4B" stroke-width="2.5" />
    <!-- Pin holes pattern -->
    <g fill="#D8D8D8">
      <circle cx="20" cy="20" r="2" /><circle cx="35" cy="20" r="2" /><circle cx="50" cy="20" r="2" /><circle cx="65" cy="20" r="2" /><circle cx="80" cy="20" r="2" />
      <circle cx="20" cy="35" r="2" /><circle cx="35" cy="35" r="2" /><circle cx="50" cy="35" r="2" /><circle cx="65" cy="35" r="2" /><circle cx="80" cy="35" r="2" />
      <circle cx="200" cy="20" r="2" /><circle cx="215" cy="20" r="2" /><circle cx="230" cy="20" r="2" /><circle cx="245" cy="20" r="2" /><circle cx="260" cy="20" r="2" />
      <circle cx="200" cy="35" r="2" /><circle cx="215" cy="35" r="2" /><circle cx="230" cy="35" r="2" /><circle cx="245" cy="35" r="2" /><circle cx="260" cy="35" r="2" />
    </g>

    <!-- Microcontroller Chip (Center) -->
    <rect x="95" y="30" width="90" height="75" rx="8" fill="#3C2A3E" stroke="#4A2E4B" stroke-width="2" />
    <!-- Pins on chip -->
    <g fill="#FFE599">
      <rect x="85" y="40" width="10" height="4" rx="1" />
      <rect x="85" y="52" width="10" height="4" rx="1" />
      <rect x="85" y="64" width="10" height="4" rx="1" />
      <rect x="85" y="76" width="10" height="4" rx="1" />
      <rect x="85" y="88" width="10" height="4" rx="1" />
      <rect x="185" y="40" width="10" height="4" rx="1" />
      <rect x="185" y="52" width="10" height="4" rx="1" />
      <rect x="185" y="64" width="10" height="4" rx="1" />
      <rect x="185" y="76" width="10" height="4" rx="1" />
      <rect x="185" y="88" width="10" height="4" rx="1" />
    </g>
    <!-- Cute face on chip -->
    <circle cx="125" cy="62" r="3" fill="#FF8FAB" />
    <circle cx="155" cy="62" r="3" fill="#FF8FAB" />
    <path d="M 136 72 Q 140 76 144 72" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    <text x="140" y="48" font-family="'Courier New', monospace" font-size="8" fill="#FFE599" text-anchor="middle">MCU-NODE</text>
    <text x="140" y="92" font-family="'Courier New', monospace" font-size="7" fill="#E0AAFF" text-anchor="middle">UART · 9600</text>

    <!-- Colorful Jumper wires -->
    <path d="M 85 42 C 50 30 40 70 30 110" fill="none" stroke="#FB6F92" stroke-width="3" stroke-linecap="round" />
    <path d="M 85 66 C 60 70 50 110 55 125" fill="none" stroke="#2EC4B6" stroke-width="3" stroke-linecap="round" />
    <path d="M 195 52 C 220 30 240 70 250 110" fill="none" stroke="#FFE599" stroke-width="3" stroke-linecap="round" />
    <path d="M 195 76 C 220 80 235 110 230 125" fill="none" stroke="#C77DFF" stroke-width="3" stroke-linecap="round" />

    <!-- Sensor Module (Left) -->
    <rect x="18" y="105" width="45" height="28" rx="4" fill="#D8F3DC" stroke="#4A2E4B" stroke-width="1.5" />
    <text x="40" y="122" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="bold" fill="#2D6A4F" text-anchor="middle">TEMP/HUM</text>

    <!-- LED Status (Right) -->
    <circle cx="235" cy="115" r="6" fill="#FB6F92" stroke="#4A2E4B" stroke-width="1.5" />
    <circle cx="235" cy="115" r="2" fill="#FFFFFF" />
  </g>

  <!-- Labels -->
  <g transform="translate(45, 192) rotate(-2)">
    <rect x="0" y="0" width="130" height="24" rx="4" fill="#E0AAFF" stroke="#4A2E4B" stroke-width="2" />
    <text x="65" y="16" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#3C2A3E" text-anchor="middle">⚡ SERIAL TELEMETRY</text>
  </g>
  <g transform="translate(200, 192) rotate(3)">
    <rect x="0" y="0" width="150" height="24" rx="12" fill="#FFCAD4" stroke="#4A2E4B" stroke-width="2" />
    <text x="75" y="16" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#3C2A3E" text-anchor="middle">C &amp; PYTHON DATA PIPELINE</text>
  </g>
</svg>
