<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF8F8" />
      <stop offset="100%" stop-color="#FFEBF2" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#waterGrad)" rx="16" />

  <!-- Background telemetry waves -->
  <path d="M 0 190 Q 100 170 200 190 T 400 190 L 400 240 L 0 240 Z" fill="#D8F3DC" opacity="0.4" />
  <path d="M 0 205 Q 100 185 200 205 T 400 205 L 400 240 L 0 240 Z" fill="#B7E4C7" opacity="0.3" />

  <!-- CUTE WATER DROPLET (Left) -->
  <g transform="translate(60, 35)">
    <!-- Droplet Body -->
    <path d="M 50 15 C 50 15 15 65 15 95 C 15 125 35 140 55 140 C 75 140 95 125 95 95 C 95 65 60 15 50 15 Z" fill="#A0E7E5" stroke="#4A2E4B" stroke-width="3" stroke-linejoin="round" />
    <!-- Glint -->
    <ellipse cx="38" cy="75" rx="6" ry="14" transform="rotate(-25 38 75)" fill="#FFFFFF" opacity="0.8" />
    
    <!-- Cute Droplet Face -->
    <circle cx="45" cy="95" r="2.5" fill="#4A2E4B" />
    <circle cx="65" cy="95" r="2.5" fill="#4A2E4B" />
    <path d="M 51 103 Q 55 107 59 103" fill="none" stroke="#4A2E4B" stroke-width="2" stroke-linecap="round" />
    <!-- Blush -->
    <circle cx="38" cy="100" r="3" fill="#FB6F92" opacity="0.8" />
    <circle cx="72" cy="100" r="3" fill="#FB6F92" opacity="0.8" />

    <!-- Cute Leaf on Head -->
    <path d="M 50 18 C 40 5 45 -4 55 2 C 55 10 52 16 50 18 Z" fill="#74C69D" stroke="#4A2E4B" stroke-width="1.5" />
    <!-- Sensor Probe touching water -->
    <rect x="75" y="65" width="40" height="8" rx="4" fill="#FFE599" stroke="#4A2E4B" stroke-width="2" />
    <line x1="115" y1="69" x2="145" y2="69" stroke="#FB6F92" stroke-width="2.5" stroke-dasharray="3 3" />
  </g>

  <!-- IOT & TELEMETRY DASHBOARD (Right) -->
  <g transform="translate(205, 30)">
    <!-- Glass/Card panel -->
    <rect x="0" y="0" width="160" height="150" rx="10" fill="#FFFFFF" stroke="#4A2E4B" stroke-width="2.5" />
    <!-- Card header -->
    <rect x="0" y="0" width="160" height="24" rx="10" fill="#FFCAD4" />
    <rect x="0" y="14" width="160" height="10" fill="#FFCAD4" />
    <text x="80" y="16" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#3C2A3E" text-anchor="middle">💧 SENSOR METRICS</text>

    <!-- pH Meter Pill -->
    <g transform="translate(15, 32)">
      <rect x="0" y="0" width="130" height="24" rx="6" fill="#FFF0F5" stroke="#FF8FAB" stroke-width="1.5" />
      <text x="10" y="16" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#3C2A3E">pH : 7.2</text>
      <rect x="80" y="5" width="40" height="14" rx="7" fill="#D8F3DC" />
      <text x="100" y="15" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold" fill="#2D6A4F" text-anchor="middle">Optimal</text>
    </g>

    <!-- Turbidity & TDS -->
    <g transform="translate(15, 62)">
      <rect x="0" y="0" width="130" height="24" rx="6" fill="#FFF0F5" stroke="#E0AAFF" stroke-width="1.5" />
      <text x="10" y="16" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#3C2A3E">TDS: 140 ppm</text>
      <circle cx="115" cy="12" r="5" fill="#FFE599" stroke="#4A2E4B" stroke-width="1" />
    </g>

    <!-- Temperature & Monsoon telemetry graph -->
    <g transform="translate(15, 92)">
      <rect x="0" y="0" width="130" height="46" rx="6" fill="#F8F9FA" stroke="#E5E5E5" stroke-width="1" />
      <polyline points="10,35 35,26 65,30 95,15 120,20" fill="none" stroke="#2EC4B6" stroke-width="2" stroke-linecap="round" />
      <circle cx="95" cy="15" r="3" fill="#FB6F92" />
      <text x="10" y="42" font-family="'Courier New', monospace" font-size="7" fill="#735D78">Temp: 24.5°C · Monsoon risk: Low</text>
    </g>
  </g>

  <!-- STICKERS / TAGS -->
  <g transform="translate(25, 185) rotate(-3)">
    <rect x="0" y="0" width="115" height="24" rx="4" fill="#FFE599" stroke="#4A2E4B" stroke-width="2" />
    <text x="57" y="16" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#3C2A3E" text-anchor="middle">📡 IOT TELEMETRY</text>
  </g>
  <g transform="translate(155, 188) rotate(2)">
    <rect x="0" y="0" width="140" height="24" rx="12" fill="#FFCAD4" stroke="#4A2E4B" stroke-width="2" />
    <text x="70" y="16" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#3C2A3E" text-anchor="middle">🌊 WATER QUALITY RISKS</text>
  </g>
  <g transform="translate(305, 185) rotate(-2)">
    <rect x="0" y="0" width="75" height="24" rx="4" fill="#D8F3DC" stroke="#4A2E4B" stroke-width="2" />
    <text x="37" y="16" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#3C2A3E" text-anchor="middle">FLASK ♡</text>
  </g>
</svg>
