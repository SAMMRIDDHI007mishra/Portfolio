<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="fridayBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBF0" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#fridayBg)" rx="16" />
  
  <!-- Scrapbook grid lines -->
  <g stroke="#FFD6E0" stroke-width="1" opacity="0.6">
    <line x1="20" y1="40" x2="380" y2="40" />
    <line x1="20" y1="80" x2="380" y2="80" />
    <line x1="20" y1="120" x2="380" y2="120" />
    <line x1="20" y1="160" x2="380" y2="160" />
    <line x1="20" y1="200" x2="380" y2="200" />
  </g>

  <!-- Laptop with AI interface -->
  <g transform="translate(60, 45)">
    <!-- Screen Shell -->
    <rect x="0" y="0" width="170" height="115" rx="10" fill="#FF8FAB" stroke="#4A2E4B" stroke-width="2.5" />
    <!-- Screen Display -->
    <rect x="8" y="8" width="154" height="99" rx="6" fill="#2E1F30" />
    <!-- AI wave circles -->
    <circle cx="85" cy="50" r="30" fill="none" stroke="#E0AAFF" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6" />
    <circle cx="85" cy="50" r="20" fill="none" stroke="#FF8FAB" stroke-width="2" />
    <circle cx="85" cy="50" r="10" fill="#FB6F92" />
    <!-- Chat bubbles -->
    <rect x="18" y="20" width="55" height="14" rx="7" fill="#4A2E4B" />
    <text x="45" y="30" font-family="'Courier New', monospace" font-size="7" fill="#FFE599" text-anchor="middle">&gt; prompt()</text>
    <rect x="95" y="72" width="60" height="14" rx="7" fill="#FB6F92" />
    <text x="125" y="82" font-family="'Segoe UI', sans-serif" font-size="7" fill="#FFFFFF" text-anchor="middle">intent: assist ♡</text>
    <!-- Base -->
    <path d="M -15 115 L 185 115 L 195 130 L -25 130 Z" fill="#FFE5EC" stroke="#4A2E4B" stroke-width="2.5" />
  </g>

  <!-- Cute AI Bot Assistant Companion -->
  <g transform="translate(265, 40)">
    <!-- Antenna -->
    <line x1="45" y1="30" x2="45" y2="15" stroke="#4A2E4B" stroke-width="2.5" />
    <circle cx="45" cy="12" r="5" fill="#FFE599" stroke="#4A2E4B" stroke-width="2" />
    <!-- Bot Head -->
    <rect x="15" y="30" width="60" height="52" rx="16" fill="#FFFFFF" stroke="#4A2E4B" stroke-width="3" />
    <!-- Face Screen -->
    <rect x="23" y="38" width="44" height="26" rx="8" fill="#3C2A3E" />
    <!-- Happy eyes -->
    <path d="M 32 50 Q 36 46 40 50" fill="none" stroke="#FF8FAB" stroke-width="2" stroke-linecap="round" />
    <path d="M 50 50 Q 54 46 58 50" fill="none" stroke="#FF8FAB" stroke-width="2" stroke-linecap="round" />
    <!-- Blush -->
    <circle cx="20" cy="62" r="3" fill="#FB6F92" />
    <circle cx="70" cy="62" r="3" fill="#FB6F92" />
    <!-- Body -->
    <rect x="22" y="86" width="46" height="38" rx="10" fill="#E0AAFF" stroke="#4A2E4B" stroke-width="2.5" />
    <!-- Heart Badge on chest -->
    <path d="M 45 108 C 45 108 39 102 39 99 C 39 97 41 95 43 96 C 44 95 46 95 47 96 C 49 95 51 97 51 99 C 51 102 45 108 45 108 Z" fill="#FB6F92" />
    <!-- Mini floating speech -->
    <rect x="5" y="132" width="80" height="22" rx="11" fill="#FFFFFF" stroke="#4A2E4B" stroke-width="2" />
    <text x="45" y="146" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#3C2A3E" text-anchor="middle">"Ready, Samriddhi!"</text>
  </g>

  <!-- Stickers -->
  <g transform="translate(25, 175) rotate(-5)">
    <rect x="0" y="0" width="105" height="24" rx="12" fill="#D8F3DC" stroke="#4A2E4B" stroke-width="2" />
    <text x="52" y="16" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#3C2A3E" text-anchor="middle">⚡ NLP &amp; TOOLS</text>
  </g>
  <g transform="translate(145, 185) rotate(4)">
    <rect x="0" y="0" width="80" height="22" rx="4" fill="#FFE599" stroke="#4A2E4B" stroke-width="2" />
    <text x="40" y="15" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#3C2A3E" text-anchor="middle">MEMORY ♡</text>
  </g>
  <!-- Sparkles -->
  <path d="M 245 28 L 247 22 L 249 28 L 255 30 L 249 32 L 247 38 L 245 32 L 239 30 Z" fill="#FFE599" stroke="#4A2E4B" stroke-width="1.5" />
  <path d="M 370 185 L 372 180 L 374 185 L 379 187 L 374 189 L 372 194 L 370 189 L 365 187 Z" fill="#FF8FAB" stroke="#4A2E4B" stroke-width="1.5" />
</svg>
