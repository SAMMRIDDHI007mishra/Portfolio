<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="webGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="100%" stop-color="#FFE3EC" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#webGrad)" rx="16" />

  <!-- Browser Window Frame -->
  <g transform="translate(50, 30)">
    <rect x="0" y="0" width="300" height="155" rx="10" fill="#FFFFFF" stroke="#4A2E4B" stroke-width="2.5" />
    <!-- Browser Top Bar -->
    <rect x="0" y="0" width="300" height="28" rx="10" fill="#FFCAD4" />
    <rect x="0" y="16" width="300" height="12" fill="#FFCAD4" />
    <!-- Window controls -->
    <circle cx="16" cy="14" r="4" fill="#FB6F92" />
    <circle cx="28" cy="14" r="4" fill="#FFE599" />
    <circle cx="40" cy="14" r="4" fill="#95D5B2" />
    <!-- Address Bar -->
    <rect x="60" y="6" width="180" height="16" rx="8" fill="#FFFFFF" />
    <text x="150" y="18" font-family="'Segoe UI', sans-serif" font-size="8" fill="#735D78" text-anchor="middle">file:///portfolio/index.html ♡</text>

    <!-- Browser Content Mockup -->
    <!-- Mini Navbar -->
    <rect x="15" y="38" width="270" height="14" rx="4" fill="#FFF0F5" />
    <text x="30" y="48" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="bold" fill="#3C2A3E">♡ SAMRIDDHI</text>
    <!-- Mockup Hero Layout -->
    <rect x="15" y="60" width="125" height="12" rx="3" fill="#FF8FAB" />
    <rect x="15" y="78" width="115" height="8" rx="2" fill="#FFD0DD" />
    <rect x="15" y="90" width="95" height="8" rx="2" fill="#FFD0DD" />
    <rect x="15" y="106" width="45" height="14" rx="7" fill="#FB6F92" />
    <!-- Mini illustration right -->
    <rect x="160" y="60" width="125" height="75" rx="6" fill="#FDE2E4" stroke="#FFCAD4" stroke-width="1.5" />
    <circle cx="222" cy="95" r="18" fill="#FF8FAB" opacity="0.4" />
    <path d="M 222 92 C 222 92 216 86 216 83 C 216 81 218 79 220 80 C 221 79 223 79 224 80 C 226 79 228 81 228 83 C 228 86 222 92 222 92 Z" fill="#FB6F92" />
  </g>

  <!-- Cute Sticker Pins -->
  <g transform="translate(35, 192) rotate(-3)">
    <rect x="0" y="0" width="135" height="24" rx="4" fill="#D8F3DC" stroke="#4A2E4B" stroke-width="2" />
    <text x="67" y="16" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#3C2A3E" text-anchor="middle">🌸 HTML5 · CSS3 · JS</text>
  </g>
  <g transform="translate(200, 192) rotate(2)">
    <rect x="0" y="0" width="165" height="24" rx="12" fill="#FFE599" stroke="#4A2E4B" stroke-width="2" />
    <text x="82" y="16" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#3C2A3E" text-anchor="middle">★ ZERO BUILD DEPENDENCIES</text>
  </g>
</svg>
