<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="algoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF2F8" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#algoGrad)" rx="16" />

  <!-- Binary Tree Illustration -->
  <g transform="translate(60, 25)">
    <!-- Tree branches -->
    <line x1="140" y1="30" x2="80" y2="75" stroke="#4A2E4B" stroke-width="2.5" />
    <line x1="140" y1="30" x2="200" y2="75" stroke="#4A2E4B" stroke-width="2.5" />
    <line x1="80" y1="75" x2="40" y2="120" stroke="#4A2E4B" stroke-width="2" />
    <line x1="80" y1="75" x2="110" y2="120" stroke="#4A2E4B" stroke-width="2" />
    <line x1="200" y1="75" x2="170" y2="120" stroke="#4A2E4B" stroke-width="2" />
    <line x1="200" y1="75" x2="240" y2="120" stroke="#4A2E4B" stroke-width="2" />

    <!-- Root Node -->
    <circle cx="140" cy="30" r="18" fill="#FF8FAB" stroke="#4A2E4B" stroke-width="2.5" />
    <text x="140" y="34" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">50</text>

    <!-- Level 1 Nodes -->
    <circle cx="80" cy="75" r="16" fill="#E0AAFF" stroke="#4A2E4B" stroke-width="2" />
    <text x="80" y="79" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#3C2A3E" text-anchor="middle">25</text>

    <circle cx="200" cy="75" r="16" fill="#FFE599" stroke="#4A2E4B" stroke-width="2" />
    <text x="200" y="79" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#3C2A3E" text-anchor="middle">75</text>

    <!-- Level 2 Nodes -->
    <circle cx="40" cy="120" r="14" fill="#D8F3DC" stroke="#4A2E4B" stroke-width="2" />
    <text x="40" y="124" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#2D6A4F" text-anchor="middle">10</text>

    <circle cx="110" cy="120" r="14" fill="#D8F3DC" stroke="#4A2E4B" stroke-width="2" />
    <text x="110" y="124" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#2D6A4F" text-anchor="middle">30</text>

    <circle cx="170" cy="120" r="14" fill="#D8F3DC" stroke="#4A2E4B" stroke-width="2" />
    <text x="170" y="124" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#2D6A4F" text-anchor="middle">60</text>

    <circle cx="240" cy="120" r="14" fill="#D8F3DC" stroke="#4A2E4B" stroke-width="2" />
    <text x="240" y="124" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#2D6A4F" text-anchor="middle">90</text>

    <!-- Big-O complexity badge -->
    <g transform="translate(195, 0)">
      <rect x="0" y="0" width="80" height="22" rx="11" fill="#FFFFFF" stroke="#4A2E4B" stroke-width="2" />
      <text x="40" y="15" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#FB6F92" text-anchor="middle">O(log n) ♡</text>
    </g>
  </g>

  <!-- Labels -->
  <g transform="translate(40, 190) rotate(-2)">
    <rect x="0" y="0" width="135" height="24" rx="4" fill="#FFCAD4" stroke="#4A2E4B" stroke-width="2" />
    <text x="67" y="16" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#3C2A3E" text-anchor="middle">🌳 TREES &amp; RECURSION</text>
  </g>
  <g transform="translate(200, 190) rotate(2)">
    <rect x="0" y="0" width="155" height="24" rx="12" fill="#D8F3DC" stroke="#4A2E4B" stroke-width="2" />
    <text x="77" y="16" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#3C2A3E" text-anchor="middle">★ BENCHMARKING WITH NUMPY</text>
  </g>
</svg>
